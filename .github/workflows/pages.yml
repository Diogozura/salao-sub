name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Injetar API_URL
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "Secret API_URL não definido"; exit 1; fi
          mkdir -p dist
          cp -r index.html css js dist/
          sed -i "s|__API_URL__|${API_URL}|g" dist/js/config.js
          grep -q "__API_URL__" dist/js/config.js && { echo "API_URL não foi injetado"; exit 1; } || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
